<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dirección Estrategica II</title>
    <style>
        :root { --primary: #0f172a; --accent: #3b82f6; --bg: #f8fafc; --text: #334155; --success: #22c55e; --error: #ef4444; --warning: #f59e0b; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px; line-height: 1.5; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        
        /* Header */
        h1 { color: var(--primary); text-align: center; margin-bottom: 5px; font-weight: 800; letter-spacing: -0.5px; }
        .subtitle { text-align: center; color: #64748b; margin-bottom: 30px; font-size: 0.95rem; }

        /* Grid de Bloques */
        .block-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .block-card {
            background: white; border: 2px solid #e2e8f0; padding: 15px; border-radius: 12px; cursor: pointer;
            transition: all 0.2s; position: relative; display: flex; flex-direction: column; justify-content: center;
        }
        .block-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .block-card.selected { background: #eff6ff; border-color: var(--accent); ring: 2px var(--accent); }
        .block-card h3 { margin: 0 0 5px 0; font-size: 1rem; color: var(--primary); }
        .block-card p { margin: 0; font-size: 0.8rem; color: #64748b; }
        .badge { position: absolute; top: 10px; right: 10px; background: #e2e8f0; color: #475569; font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; font-weight: 700; }

        /* Área de Quiz */
        .status-bar { 
            display: flex; justify-content: space-between; align-items: center; 
            background: #f1f5f9; padding: 10px 20px; border-radius: 10px; margin-bottom: 25px; font-size: 0.9rem; font-weight: 600; color: #475569;
        }
        .queue-badge { background: var(--warning); color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; margin-left: 5px; }

        .question-box { animation: fadeIn 0.3s ease; }
        .q-meta { font-size: 0.8rem; color: var(--accent); font-weight: 700; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 0.5px; }
        .q-text { font-size: 1.25rem; font-weight: 700; color: var(--primary); margin-bottom: 25px; }
        
        .opt-btn {
            display: block; width: 100%; text-align: left; background: white; border: 2px solid #e2e8f0;
            padding: 15px 20px; border-radius: 12px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s;
            font-size: 1rem; color: var(--text); position: relative;
        }
        .opt-btn:hover:not(:disabled) { border-color: var(--accent); background: #f8fafc; }
        .opt-btn.correct { background: #dcfce7 !important; border-color: var(--success) !important; color: #14532d; }
        .opt-btn.wrong { background: #fee2e2 !important; border-color: var(--error) !important; color: #7f1d1d; }
        
        /* Feedback y Botones */
        .feedback { 
            background: #f0f9ff; border-left: 5px solid var(--accent); padding: 20px; 
            border-radius: 8px; margin-top: 25px; display: none; font-size: 0.95rem;
        }
        .retry-tag { display: inline-block; background: var(--error); color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; margin-bottom: 5px; }

        .btn {
            background: var(--primary); color: white; border: none; padding: 14px 30px; border-radius: 10px;
            font-weight: 700; cursor: pointer; font-size: 1rem; transition: transform 0.1s; width: 100%;
        }
        .btn:active { transform: scale(0.98); }
        .btn-outline { background: transparent; border: 2px solid #cbd5e1; color: #64748b; margin-top: 10px; }
        .btn-outline:hover { border-color: var(--text); color: var(--text); }
        
        /* Resultados Intermedios */
        .batch-result { text-align: center; padding: 20px 0; }
        .score-big { font-size: 3rem; font-weight: 800; color: var(--primary); margin: 10px 0; }
        .batch-stats { display: flex; gap: 10px; justify-content: center; margin-bottom: 30px; }
        .stat-box { background: #f1f5f9; padding: 10px 20px; border-radius: 8px; }

        .hidden { display: none !important; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div id="screen-menu">
        <h1>Dirección ESTRATEGICA II</h1>
        <p class="subtitle">Florín Emanuel Todor Gliga</p>
        
        <div class="block-grid" id="block-grid"></div>
        
        <div style="max-width: 400px; margin: 0 auto;">
            <button class="btn" onclick="startSystem()">COMENZAR ENTRENAMIENTO</button>
        </div>
    </div>

    <div id="screen-quiz" class="hidden">
        <div class="status-bar">
            <span>Tanda actual: <span id="batch-progress">1/20</span></span>
            <span>Pendientes totales: <span id="total-queue">0</span></span>
        </div>

        <div id="question-area"></div>

        <div id="feedback-area" class="feedback">
            <div id="retry-msg" class="retry-tag hidden">FALLADA - SE AÑADE A LA COLA</div>
            <div><strong style="color: var(--accent);">Explicación:</strong> <span id="feedback-text"></span></div>
        </div>

        <div style="margin-top: 25px;">
            <button id="next-btn" class="btn hidden" onclick="nextQuestion()">Siguiente Pregunta →</button>
        </div>
        
        <div style="text-align: center; margin-top: 20px;">
            <button class="btn btn-outline" style="width: auto; padding: 8px 20px; font-size: 0.9rem;" onclick="quitToMenu()">Salir al Menú</button>
        </div>
    </div>

    <div id="screen-batch-end" class="hidden">
        <div class="batch-result">
            <h2>Tanda Completada</h2>
            <p>Resumen de estas 20 preguntas</p>
            
            <div class="score-big"><span id="batch-score">0</span>%</div>
            
            <div class="batch-stats">
                <div class="stat-box"><strong style="color:var(--success)" id="batch-correct">0</strong> Aciertos</div>
                <div class="stat-box"><strong style="color:var(--error)" id="batch-wrong">0</strong> Fallos (Reencolados)</div>
            </div>

            <p id="msg-queue-status" style="margin-bottom: 30px; color: #64748b;"></p>

            <button id="continue-btn" class="btn" onclick="startNextBatch()">CONTINUAR SIGUIENTE TANDA</button>
            <button class="btn btn-outline" onclick="quitToMenu()">Finalizar por hoy</button>
        </div>
    </div>
</div>

<script>
/* ==============================================
   1. BASE DE DATOS (PREGUNTAS TEMA 1-4)
   ============================================== */ 
const RAW_DATA = [
    {
        "b": 1,
        "q": "1. Según Abell (1980), ¿cuáles son las tres dimensiones para definir el concepto de negocio o campo de actividad de una empresa?",
        "o": [
            "a) Productos, mercados y clientes.",
            "b) Ventas, beneficios y activos.",
            "c) Funciones de los clientes que se cubren, grupos de clientes a los que se sirve y tecnologías utilizadas.",
            "d) Misión, visión y valores."
        ],
        "a": 2,
        "exp": "Según el modelo de Abell, un negocio se define por las funciones que cubre, los clientes a los que sirve y la tecnología usada."
    },
    {
        "b": 1,
        "q": "2. En la definición del campo de actividad, el \"ámbito\" se refiere a:",
        "o": [
            "a) El grado en que una empresa trata de forma diferente a los distintos segmentos estratégicos.",
            "b) La capacidad de la empresa para innovar en nuevos productos.",
            "c) El número de funciones, de grupos de clientes o de tecnologías que utiliza la empresa.",
            "d) La cuota de mercado que la empresa posee en su industria."
        ],
        "a": 2,
        "exp": "El ámbito hace referencia a la amplitud, es decir, el número de funciones, clientes y tecnologías que cubre la empresa."
    },
    {
        "b": 1,
        "q": "3. ¿Cuál de las siguientes afirmaciones describe mejor la diferencia entre \"crecimiento\" y \"desarrollo\" de una empresa?",
        "o": [
            "a) El crecimiento se refiere a la expansión geográfica, mientras que el desarrollo se refiere a la diversificación de productos.",
            "b) El desarrollo se refiere a incrementos de tamaño en variables cuantificables, mientras que el crecimiento es un concepto más amplio.",
            "c) El crecimiento es la única forma de crear valor, mientras que el desarrollo no.",
            "d) El crecimiento se refiere a incrementos de tamaño en variables cuantificables, mientras que el desarrollo es un concepto más amplio que incluye modificaciones tanto cuantitativas como cualitativas en las características internas de la empresa."
        ],
        "a": 3,
        "exp": "El crecimiento es cuantitativo, mientras que el desarrollo incluye cambios cualitativos en la empresa, como su composición y estructura."
    },
    {
        "b": 1,
        "q": "4. El \"Efecto Reina Roja\" en el contexto empresarial ilustra la necesidad de:",
        "o": [
            "a) Correr lo más rápido posible para llegar a otro lugar.",
            "b) Crecer continuamente incluso solo para mantener la posición competitiva en entornos dinámicos.",
            "c) Reducir el tamaño de la empresa para ser más ágil.",
            "d) Diversificar las actividades para minimizar el riesgo."
        ],
        "a": 1,
        "exp": "El Efecto Reina Roja implica que en un entorno competitivo dinámico, las empresas deben moverse solo para mantener su posición actual."
    },
    {
        "b": 1,
        "q": "5. ¿Cuál es el propósito último de las estrategias de desarrollo de una empresa, según Collis y Montgomery (2007)?",
        "o": [
            "a) Incrementar la cuota de mercado.",
            "b) Minimizar los costes operativos.",
            "c) Satisfacer las necesidades de los directivos.",
            "d) La creación de valor."
        ],
        "a": 3,
        "exp": "El objetivo fundamental de cualquier estrategia corporativa es la creación de valor para los accionistas o grupos de interés."
    },
    {
        "b": 1,
        "q": "6. La tipología de estrategias de crecimiento y desarrollo de Ansoff (1976) distingue principalmente entre:",
        "o": [
            "a) Integración vertical y reestructuración.",
            "b) Expansión y diversificación.",
            "c) Consolidación y saneamiento.",
            "d) Desarrollo interno y desarrollo externo."
        ],
        "a": 1,
        "exp": "La matriz de Ansoff clasifica las opciones de crecimiento estratégico principalmente en expansión y diversificación."
    },
    {
        "b": 1,
        "q": "7. Una limitación de la clasificación de Ansoff (1976) es que tiende a:",
        "o": [
            "a) Solo considerar productos, no mercados.",
            "b) Identificar desarrollo con crecimiento empresarial, sin incluir la reducción de tamaño (reestructuración).",
            "c) Enfocarse únicamente en empresas pequeñas.",
            "d) No tener en cuenta la tecnología."
        ],
        "a": 1,
        "exp": "La matriz de Ansoff solo contempla estrategias de crecimiento, dejando fuera opciones como la reestructuración o el saneamiento."
    },
    {
        "b": 1,
        "q": "8. ¿Qué estrategia de desarrollo implica que la empresa se introduce en nuevos productos y mercados simultáneamente, suponiendo una ruptura con la situación actual?",
        "o": [
            "a) Expansión.",
            "b) Consolidación.",
            "c) Integración vertical.",
            "d) Diversificación."
        ],
        "a": 3,
        "exp": "La diversificación implica la entrada simultánea en nuevos productos y nuevos mercados."
    },
    {
        "b": 1,
        "q": "9. La estrategia de \"penetración en el mercado\" se caracteriza por:",
        "o": [
            "a) Introducir nuevos productos en los mercados actuales.",
            "b) Introducir productos tradicionales en nuevos mercados.",
            "c) Aumentar el volumen de ventas dirigiéndose a clientes actuales o buscando nuevos clientes similares para productos actuales.",
            "d) Abandonar negocios con bajos resultados."
        ],
        "a": 2,
        "exp": "La penetración del mercado consiste en crecer con los productos actuales en los mercados actuales, aumentando las ventas."
    },
    {
        "b": 1,
        "q": "10. ¿Cuál de las siguientes no es una de las \"tres dimensiones\" en las que se pueden entender los nuevos mercados en una estrategia de \"desarrollo de mercados\" según Whittington et al. (2020)?",
        "o": [
            "a) Nuevos segmentos de la industria.",
            "b) Nuevas aplicaciones para los actuales productos.",
            "c) Nuevas áreas geográficas.",
            "d) Nuevas tecnologías de producción."
        ],
        "a": 3,
        "exp": "Las dimensiones de nuevos mercados suelen ser segmentos, geografías y usos; las tecnologías representan producto."
    },
    {
        "b": 1,
        "q": "11. Una de las principales razones externas para que las empresas diversifiquen sus actividades es:",
        "o": [
            "a) La existencia de recursos y capacidades excedentes.",
            "b) La reducción del riesgo global de la empresa.",
            "c) La saturación del mercado tradicional, que impide alcanzar objetivos de crecimiento por expansión.",
            "d) La consecución de sinergias financieras."
        ],
        "a": 2,
        "exp": "La saturación del mercado actual obliga a la empresa a buscar oportunidades de crecimiento externos diversificando."
    },
    {
        "b": 1,
        "q": "12. ¿Qué tipo de sinergias se pueden obtener en la diversificación no relacionada (conglomerada)?",
        "o": [
            "a) Solo productivas y comerciales.",
            "b) Solo de distribución y marketing.",
            "c) Principalmente financieras y directivas (capacidad genérica para resolver problemas).",
            "d) Principalmente de I+D y fabricación."
        ],
        "a": 2,
        "exp": "Al no haber relación operativa entre negocios, las sinergias se centran en la gestión financiera y directiva."
    },
    {
        "b": 1,
        "q": "13. La \"integración vertical hacia atrás\" ocurre cuando una empresa:",
        "o": [
            "a) Se convierte en su propio distribuidor o cliente.",
            "b) Se convierte en su propio proveedor de factores productivos.",
            "c) Vende sus productos en nuevos mercados geográficos.",
            "d) Adquiere empresas de su competencia directa."
        ],
        "a": 1,
        "exp": "Consiste en asumir actividades previas en la cadena de valor, es decir, convertirse en proveedor de uno mismo."
    },
    {
        "b": 1,
        "q": "14. Uno de los riesgos principales de la integración vertical es:",
        "o": [
            "a) La dificultad para generar sinergias directivas.",
            "b) La reducción de la complejidad organizativa.",
            "c) La falta de flexibilidad ante los cambios (tecnológicos o de otro tipo) en el mercado de factores o productos.",
            "d) La disminución del riesgo global de la empresa."
        ],
        "a": 2,
        "exp": "Al internalizar procesos, la empresa pierde flexibilidad para adaptarse rápidamente a los cambios del mercado."
    },
    {
        "b": 1,
        "q": "15. ¿Cuál es el objetivo principal de una estrategia de \"reestructuración\" de actividades?",
        "o": [
            "a) Alcanzar el máximo crecimiento posible.",
            "b) Mejorar la rentabilidad y crear valor para la empresa, incluso si implica reducir el tamaño o recomponer la cartera.",
            "c) Aumentar la diversificación a toda costa.",
            "d) Enfocarse en la internacionalización."
        ],
        "a": 1,
        "exp": "Consiste en recomponer la cartera para frenar resultados negativos y recuperar la creación de valor, reduciendo tamaño si es preciso."
    },
    {
        "b": 1,
        "q": "16. Cuando un negocio de la cartera de una empresa tiene resultados negativos persistentes, una de las opciones básicas es el \"saneamiento\". ¿Qué implica esta opción?",
        "o": [
            "a) El abandono inmediato del negocio mediante su liquidación.",
            "b) Tratar de recuperar la rentabilidad del negocio, manteniéndolo en la cartera.",
            "c) Vender el negocio a un competidor.",
            "d) Reestructurar la cartera de negocios en su conjunto."
        ],
        "a": 1,
        "exp": "El saneamiento implica reestructurar internamente el negocio para hacerlo rentable nuevamente sin abandonarlo."
    },
    {
        "b": 1,
        "q": "17. ¿Cuál de los siguientes no es un motivo frecuente para la reestructuración de la cartera de negocios?",
        "o": [
            "a) Una estrategia de diversificación previa inadecuada (sobrediversificación).",
            "b) La aparición de importantes competidores en los negocios centrales.",
            "c) La búsqueda de un mayor crecimiento a toda costa.",
            "d) Problemas de agencia en los órganos de gobierno que priorizan el crecimiento sobre la creación de valor."
        ],
        "a": 2,
        "exp": "La reestructuración suele priorizar la rentabilidad y creación de valor sobre el simple crecimiento del tamaño."
    },
    {
        "b": 1,
        "q": "18. En las estrategias para el abandono de un negocio, la \"estrategia de cosecha\" busca:",
        "o": [
            "a) Vender el negocio al mejor precio posible a un comprador externo.",
            "b) Maximizar los flujos financieros a corto plazo mediante el cese de inversiones y la explotación de oportunidades de rentabilidad aún existentes.",
            "c) Liquidar inmediatamente todos los activos del negocio.",
            "d) Renovar la maquinaria y reducir costes para recuperar la rentabilidad a largo plazo."
        ],
        "a": 1,
        "exp": "Consiste en dejar de invertir y extraer toda la caja posible antes de que el negocio decaiga definitivamente."
    },
    {
        "b": 1,
        "q": "1. Según el modelo de U-invertida en la relación entre diversificación y resultados, ¿qué situación lleva a una reducción de los resultados de una empresa?",
        "o": [
            "a) Cuanto mayor sea el grado de diversificación de una empresa, mejores serán sus resultados.",
            "b) Cuando las empresas cambian de una diversificación relacionada a una no relacionada.",
            "c) La diversificación relacionada siempre es superior a la no relacionada.",
            "d) Las empresas diversificadas son siempre peores que las de negocio único."
        ],
        "a": 1,
        "exp": "La rentabilidad suele disminuir al pasar a diversificación no relacionada por los excesivos costes de coordinación (U invertida)."
    },
    {
        "b": 1,
        "q": "2. ¿Cuál es la misión principal de la oficina central (matriz o centro corporativo) en una empresa diversificada?",
        "o": [
            "a) Reducir los costes de operación de cada negocio individualmente.",
            "b) Lograr que el valor de la empresa sea inferior a la suma de los valores de cada negocio independiente.",
            "c) Crear valor para los distintos negocios o unidades de negocio y, sobre todo, para el conjunto de la empresa.",
            "d) Priorizar el crecimiento en sí mismo o la reducción del riesgo global de la empresa como objetivos principales."
        ],
        "a": 2,
        "exp": "La matriz debe justificar su existencia aportando más valor al conjunto de negocios (ventaja de matriz)."
    },
    {
        "b": 1,
        "q": "3. ¿Cuál de los siguientes no es un requisito que, según Pitt y Koufopoulos (2012), debería cumplir una Unidad Estratégica de Negocio (UEN) bien definida?",
        "o": [
            "a) Su misión, estrategia y rendimiento deberían ser definidos de forma independiente.",
            "b) Ser un centro de beneficios, controlando sus actividades generadoras de costes y decidiendo sus precios de venta.",
            "c) Coincidir necesariamente con una división o departamento existente de la empresa.",
            "d) Ser autosuficiente, disponiendo de los recursos y capacidades necesarios para conseguir su misión de forma independiente."
        ],
        "a": 2,
        "exp": "Las UENs se definen por criterios estratégicos, pudiendo no coincidir con la estructura departamental."
    },
    {
        "b": 1,
        "q": "4. En el modelo de dirección de \"Planificación Estratégica\" para empresas diversificadas, ¿qué tipo de control se sigue y qué objetivos se priorizan?",
        "o": [
            "a) Control financiero estricto, priorizando objetivos a corto plazo.",
            "b) Control estratégico estricto, buscando un equilibrio entre resultados financieros y estratégicos.",
            "c) Control estratégico flexible, dando prioridad a los objetivos a largo plazo sobre los financieros a corto plazo.",
            "d) Control por ausencia, dejando total autonomía a las unidades de negocio."
        ],
        "a": 2,
        "exp": "El modelo de Planificación Estratégica implica gran participación de la matriz equilibrando objetivos."
    },
    {
        "b": 1,
        "q": "5. En la Matriz de Crecimiento-Cuota de Mercado (BCG), ¿cómo se denominan los negocios que combinan una posición competitiva fuerte con unas expectativas de crecimiento lento y son básicamente generadores de recursos que pueden desviarse a otros negocios?",
        "o": [
            "a) Estrellas.",
            "b) Dilemas.",
            "c) Pesos Muertos.",
            "d) Vacas Lecheras."
        ],
        "a": 3,
        "exp": "Tienen alta cuota en mercados maduros, generando flujos de caja importantes que financian otros negocios (vacas lecheras)."
    },
    {
        "b": 1,
        "q": "6. ¿Qué tipo de problema se presenta si los costes de coordinación de la diversificación relacionada crecen por encima de los beneficios derivados de las sinergias obtenidas?",
        "o": [
            "a) La empresa no podrá crecer en absoluto.",
            "b) La diversificación no relacionada será siempre más eficiente.",
            "c) La rentabilidad esperada de la diversificación relacionada se verá seriamente afectada.",
            "d) La oficina central dejará de tener sentido en la empresa."
        ],
        "a": 2,
        "exp": "Si los costes de gestionar la complejidad superan las sinergias obtenidas, la rentabilidad se verá mermada."
    },
    {
        "b": 1,
        "q": "7. Según Porter (1988a), ¿cuál de las siguientes es una premisa crucial para el éxito de una estrategia corporativa?",
        "o": [
            "a) La diversificación debe reducir el riesgo global de la empresa para los directivos.",
            "b) Las ventajas competitivas (y el éxito) se dan en cada uno de los negocios, por lo que las empresas diversificadas deben promoverlas y cuidarlas.",
            "c) La empresa diversificada siempre debe tener un valor de mercado inferior a la suma de sus partes.",
            "d) Los accionistas no pueden diversificar sus inversiones de forma autónoma."
        ],
        "a": 1,
        "exp": "Según Porter, la estrategia corporativa debe centrarse en facilitar que los negocios logren sus debidas ventajas."
    },
    {
        "b": 1,
        "q": "8. ¿Cuál de las siguientes funciones NO está directamente asignada a la oficina central de una empresa diversificada?",
        "o": [
            "a) Planificar y asignar recursos.",
            "b) Controlar y auditar los resultados.",
            "c) Proveer servicios centrales (ej. finanzas, jurídicos).",
            "d) Ejecutar las operaciones diarias de cada negocio individualmente sin supervisión."
        ],
        "a": 3,
        "exp": "Las operaciones diarias son responsabilidad de las UENs, la matriz planifica y provee servicios."
    },
    {
        "b": 1,
        "q": "9. Para que una oficina central tenga \"ventaja de matriz\" (parenting advantage), ¿cuál de las siguientes condiciones debería cumplirse?",

        "exp": "Según el modelo del Diamante de Porter (estudiado para medir la competitividad nacional en el Capítulo 4 y referenciado en el contexto internacional), las ventajas competitivas sostenibles no se fundamentan en los factores básicos (sol, playa, mano de obra no cualificada), sino en la dotación de factores avanzados y especializados, como las infraestructuras de calidad y el personal cualificado."
    },
   
];
/* ==============================================
   2. DEFINICIÓN DE BLOQUES (MENÚ)
   ============================================== */
const BLOCKS = [
    { id: 1, title: "Fichero Tests.pdf", desc: "92 Preguntas Generales", questions: [] },
    { id: 2, title: "Fichero wuolah-free-PREGUNTAS-TIPO-TEST-EXAMEN.pdf", desc: "300 Preguntas Tipo Test", questions: [] },
    { id: 3, title: "Fichero wuolah-free-SOLUCIONES-TEST-DIRECCION-ESTRATEGICA-II.docx.pdf", desc: "27 Preguntas Solucionadas", questions: [] },
    { id: 4, title: "Fichero wuolah-free-tests.pdf", desc: "114 Preguntas", questions: [] },
    { id: 5, title: "Examen 2020", desc: "Preguntas del pdf de examen 2020 ", questions: [] },
    { id: 6, title: "Preguntas EXAMEN POR TEMARIO", desc: "Preguntas organizadas por temas del examen", questions: [] },
    { id: 7, title: "Preguntas EXAMEN TIPO TEST ESTRATEGICA", desc: "20 Preguntas del examen tipo test de julio 2020", questions: [] },
    { id: 8, title: "Examen 2022", desc: "20 Preguntas del examen de julio 2022", questions: [] },
    { id: 9, title: "Examen Julio 2020", desc: "20 Preguntas del examen de julio 2020", questions: [] }
];
// Distribuir preguntas en bloques
RAW_DATA.forEach(item => {
    const block = BLOCKS.find(b => b.id === item.b);
    if(block) block.questions.push(item);
});

/* ==============================================
   2. MOTOR DEL SISTEMA DE EXAMEN (LÓGICA V2)
   ============================================== */

// Estado del sistema
let masterQueue = [];       // Cola global de preguntas pendientes
let currentBatch = [];      // Las preguntas de la tanda actual
let currentQIndex = 0;      // Índice dentro del batch
let batchStats = { correct: 0, wrong: 0 }; // Estadísticas de la tanda actual
let batchSize = 10;         // Tamaño del lote (dinámico)
let isSingleBlock = false;  // true si se selecciona un solo bloque

// Referencias DOM
const dom = {
    screens: { menu: document.getElementById('screen-menu'), quiz: document.getElementById('screen-quiz'), batch: document.getElementById('screen-batch-end') },
    quiz: { area: document.getElementById('question-area'), feedback: document.getElementById('feedback-area'), feedbackText: document.getElementById('feedback-text'), nextBtn: document.getElementById('next-btn'), progress: document.getElementById('batch-progress'), totalQ: document.getElementById('total-queue'), retryMsg: document.getElementById('retry-msg') },
    batch: { score: document.getElementById('batch-score'), correct: document.getElementById('batch-correct'), wrong: document.getElementById('batch-wrong'), msg: document.getElementById('msg-queue-status'), btn: document.getElementById('continue-btn') }
};

let selectedBlocksIDs = [];

// --- INICIALIZACIÓN ---
function init() {
    const grid = document.getElementById('block-grid');
    grid.innerHTML = '';
    
    // Botón "Todas"
    const allCard = document.createElement('div');
    allCard.className = 'block-card';
    allCard.innerHTML = `<h3>📚 SIMULACRO TOTAL</h3><p>Todas las preguntas disponibles</p>`;
    allCard.onclick = () => toggleAll(allCard);
    grid.appendChild(allCard);

    // Tarjetas de Bloque
    BLOCKS.forEach(b => {
        if(b.questions.length === 0) return;
        const div = document.createElement('div');
        div.className = 'block-card';
        div.innerHTML = `<h3>${b.title}</h3><p>${b.desc}</p><div class="badge">${b.questions.length}</div>`;
        div.onclick = () => toggleBlock(div, b.id);
        grid.appendChild(div);
    });
}

function toggleBlock(el, id) {
    el.classList.toggle('selected');
    if(selectedBlocksIDs.includes(id)) {
        selectedBlocksIDs = selectedBlocksIDs.filter(x => x !== id);
    } else {
        selectedBlocksIDs.push(id);
    }
}

function toggleAll(el) {
    const isSelected = el.classList.contains('selected');
    const cards = document.querySelectorAll('.block-card');
    selectedBlocksIDs = [];
    cards.forEach(c => {
        if(!isSelected) {
            c.classList.add('selected');
            if(c !== el) { // No añadir el ID del botón "Todas"
               // Lógica simplificada: si selecciono todas, lleno el array con todos los IDs
               BLOCKS.forEach(b => { if(b.questions.length > 0) selectedBlocksIDs.push(b.id); });
            }
        } else {
            c.classList.remove('selected');
        }
    });
    // Eliminar duplicados si los hubiera
    selectedBlocksIDs = [...new Set(selectedBlocksIDs)];
}

// --- COMIENZO DEL FLUJO ---
function startSystem() {
    if(selectedBlocksIDs.length === 0) { alert("Selecciona al menos un bloque."); return; }

    // 1. Detectar si es un solo bloque o simulacro
    isSingleBlock = (selectedBlocksIDs.length === 1);
    
    // 2. Construir la Master Queue
    masterQueue = [];
    selectedBlocksIDs.forEach(id => {
        const block = BLOCKS.find(b => b.id === id);
        if(block) masterQueue.push(...block.questions);
    });

    // 3. Definir tamaño de tanda
    // - Un solo bloque: todas las preguntas del bloque
    // - Varios bloques (simulacro): tandas de 20
    batchSize = isSingleBlock ? masterQueue.length : 20;

    // 4. Barajar aleatoriamente
    masterQueue.sort(() => Math.random() - 0.5);

    // 5. Iniciar la primera tanda
    startNextBatch();
}

function startNextBatch() {
    // Si no hay preguntas, fin del juego
    if(masterQueue.length === 0) {
        alert("¡Enhorabuena! Has completado y acertado todas las preguntas seleccionadas.");
        quitToMenu();
        return;
    }

    // Coger las siguientes preguntas según el tamaño de tanda
    // NOTA: Usamos splice para SACARLAS de la masterQueue. 
    // Si se fallan, se volverán a meter (push) al final.
    const size = Math.min(batchSize, masterQueue.length);
    currentBatch = masterQueue.splice(0, size);
    
    currentQIndex = 0;
    batchStats = { correct: 0, wrong: 0 };

    // Cambiar pantalla
    showScreen('quiz');
    renderQuestion();
}

// --- RENDERIZADO DE PREGUNTA ---
function renderQuestion() {
    const q = currentBatch[currentQIndex];
    
    // Actualizar UI top bar
    // Total pendientes = las que quedan en MasterQueue + las que quedan en este Batch
    const pendingTotal = masterQueue.length + (currentBatch.length - currentQIndex);
    dom.quiz.progress.textContent = `${currentQIndex + 1} / ${currentBatch.length}`;
    dom.quiz.totalQ.textContent = pendingTotal;

    // Resetear visuales
    dom.quiz.feedback.style.display = 'none';
    dom.quiz.retryMsg.classList.add('hidden');
    dom.quiz.nextBtn.classList.add('hidden');

    // HTML de la pregunta
    // Buscar el nombre del bloque para mostrarlo
    const blockTitle = BLOCKS.find(b => b.id === q.b)?.title || "General";
    
    dom.quiz.area.innerHTML = `
        <div class="question-box">
            <div class="q-meta">${blockTitle}</div>
            <div class="q-text">${q.q}</div>
            ${q.o.map((opt, i) => `
                <button class="opt-btn" onclick="submitAnswer(${i})">${opt}</button>
            `).join('')}
        </div>
    `;
}

// --- PROCESAR RESPUESTA ---
function submitAnswer(selectedIndex) {
    const q = currentBatch[currentQIndex];
    const btns = document.querySelectorAll('.opt-btn');
    
    // Bloquear botones
    btns.forEach(b => b.disabled = true);

    const isCorrect = (selectedIndex === q.a);

    if (isCorrect) {
        btns[selectedIndex].classList.add('correct');
        batchStats.correct++;
        dom.quiz.retryMsg.classList.add('hidden');
    } else {
        btns[selectedIndex].classList.add('wrong');
        btns[q.a].classList.add('correct'); // Mostrar la correcta
        batchStats.wrong++;
        
        // LÓGICA CRÍTICA: RE-ENCOLAR
        // Volvemos a meter la pregunta en la masterQueue para que salga en futuras tandas
        masterQueue.push(q);
        
        // Barajamos ligeramente la cola para que no sea predecible cuándo vuelve a salir
        // (Opcional, pero recomendado)
        masterQueue.sort(() => Math.random() - 0.5);

        dom.quiz.retryMsg.classList.remove('hidden');
    }

    // Mostrar feedback
    dom.quiz.feedbackText.textContent = q.exp;
    dom.quiz.feedback.style.display = 'block';
    dom.quiz.nextBtn.classList.remove('hidden');
}

function nextQuestion() {
    currentQIndex++;
    if (currentQIndex < currentBatch.length) {
        renderQuestion();
    } else {
        finishBatch();
    }
}

// --- FIN DE TANDA ---
function finishBatch() {
    showScreen('batch');
    
    // Cálculos
    const total = batchStats.correct + batchStats.wrong;
    const percentage = total === 0 ? 0 : Math.round((batchStats.correct / total) * 100);
    
    dom.batch.score.textContent = percentage;
    dom.batch.score.style.color = percentage >= 50 ? 'var(--success)' : 'var(--error)';
    dom.batch.correct.textContent = batchStats.correct;
    dom.batch.wrong.textContent = batchStats.wrong;

    // Mensaje sobre el estado de la cola
    if (masterQueue.length > 0) {
        dom.batch.msg.textContent = `Aún quedan ${masterQueue.length} preguntas en la cola (incluyendo los fallos de esta ronda).`;
        const nextBatchSize = Math.min(batchSize, masterQueue.length);
        dom.batch.btn.textContent = `CONTINUAR SIGUIENTE TANDA (${nextBatchSize})`;
        dom.batch.btn.style.display = 'block';
    } else {
        dom.batch.msg.textContent = "¡Has vaciado la cola de preguntas por completo!";
        dom.batch.btn.style.display = 'none'; // No se puede continuar
    }
}

// --- UTILIDADES ---
function showScreen(name) {
    Object.values(dom.screens).forEach(s => s.classList.add('hidden'));
    dom.screens[name].classList.remove('hidden');
}

function quitToMenu() {
    showScreen('menu');
    selectedBlocksIDs = [];
    document.querySelectorAll('.block-card').forEach(c => c.classList.remove('selected'));
}

// Arrancar
init();

</script>
</body>
</html>
